<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Login Demo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#1c1e21}
body{overflow-x:hidden}
.page{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1;display:grid;grid-template-columns:76.45% 23.55%;min-height:680px}
.visual{overflow:hidden;background:#fff}
.visual img{display:block;width:100%;height:100%;object-fit:cover;object-position:left top}
.panel{border-left:1px solid #ddd;display:flex;justify-content:center;align-items:flex-start;background:#fff}
.card{width:334px;margin-top:238px}
.back{display:flex;align-items:center;gap:11px;margin-bottom:21px;font-size:11px;font-weight:700}
.back button{border:0;background:transparent;font-size:23px;line-height:15px;padding:0;cursor:pointer;color:#111}
.input{width:100%;height:39px;border:1px solid #ccd0d5;border-radius:9px;padding:0 11px;font-size:10px;outline:none;margin-bottom:7px}
.input:focus{border-color:#1877f2;box-shadow:0 0 0 1px #1877f2}
.login{width:100%;height:30px;border:0;border-radius:18px;background:#1877f2;color:#fff;font-size:10px;font-weight:700;cursor:pointer}
.forgot{display:block;margin-top:16px;text-align:center;color:#111;font-size:10px;text-decoration:none}
.forgot:hover{text-decoration:underline}
.create{width:100%;height:29px;margin-top:42px;border:1px solid #1877f2;border-radius:18px;background:#fff;color:#1877f2;font-size:9px;font-weight:700;cursor:pointer}
.meta{margin-top:15px;text-align:center;color:#4b5563;font-size:10px;font-weight:600}
.message{height:16px;margin-top:8px;text-align:center;font-size:9px;color:#1877f2}
.footer{border-top:1px solid #ddd;padding:19px 20px 24px;color:#69737d;font-size:9px;line-height:1.65}
.footer-inner{max-width:680px;margin-left:calc(76.45% - 530px)}
.row{display:flex;flex-wrap:wrap;gap:0 14px}
.row + .row{margin-top:3px}
.row span{white-space:nowrap;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);align-items:center;justify-content:center;z-index:5}
.modal.show{display:flex}
.modalbox{width:340px;background:#fff;border-radius:12px;padding:22px;box-shadow:0 15px 45px rgba(0,0,0,.2)}
.modalbox h3{font-size:17px;margin:0 0 8px}
.modalbox p{font-size:11px;line-height:1.5;color:#555;margin:0 0 17px}
.modalbox button{width:100%;height:34px;border:0;border-radius:18px;background:#1877f2;color:#fff;font-weight:700;cursor:pointer}
@media(max-width:900px){
.main{display:flex;flex-direction:column;min-height:0}
.visual{height:auto}
.visual img{width:100%;height:auto;object-fit:contain}
.panel{border-left:0;border-top:1px solid #ddd;min-height:570px}
.card{margin-top:58px;width:min(380px,calc(100% - 40px))}
.footer-inner{margin:0;max-width:none;text-align:center}
.row{justify-content:center}
}
</style>
</head>

<section class="panel">
<div class="card">
<div class="back"><button type="button" onclick="history.back()" aria-label="Back">‹</button><span>Log in to Social Network</span></div>

<form id="demoForm">
<input id="email" class="input" type="text" placeholder="Email address or mobile number" autocomplete="off">
<input id="password" class="input" type="password" placeholder="Password" autocomplete="off">
<button class="login" type="submit">Log in</button>
</form>

<a class="forgot" href="#" onclick="openModal(event,'Password recovery','This demo does not connect to an account or process passwords.')">Forgotten password?</a>
<button class="create" type="button" onclick="openModal(null,'Create an account','Connect this button to your own registration flow.')">Create new account</button>
<div id="message" class="message"></div>
<div class="meta">Social</div>
</div>
</section>
</main>

</div>

<div id="modal" class="modal">
<div class="modalbox">
<h3 id="mtitle"></h3><p id="mtext"></p><button onclick="closeModal()">Close</button>
</div>
</div>

<script>
document.getElementById('demoForm').addEventListener('submit',function(e){
e.preventDefault();
const email=document.getElementById('email').value.trim();
const password=document.getElementById('password').value;
const msg=document.getElementById('message');
if(!email||!password){
msg.textContent='Please complete both fields.';
msg.style.color='#d93025';
return;
}
msg.textContent='Demo only — nothing was sent or stored.';
msg.style.color='#1877f2';
document.getElementById('password').value='';
});

function openModal(e,title,text){
if(e)e.preventDefault();
document.getElementById('mtitle').textContent=title;
document.getElementById('mtext').textContent=text;
document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
</script>
